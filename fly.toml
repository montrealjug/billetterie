# fly.toml app configuration file generated for billetterie on 2025-04-14T20:04:27-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'billetterie'
primary_region = 'yyz'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']
  [[http_service.checks]]
    grace_period = "40s"
    interval = "1m0s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"
    protocol = "http"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

# no [build] section: the image is built by the Spring Boot Maven plugin (see `pom.xml`)
# and deployed with `flyctl deploy --image ...` (see `.github/workflows/run-tests-and-deploy.yml`)
